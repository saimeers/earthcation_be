# CI de la API: corre en cada PR y en cada push a develop/main. Railway despliega main,
# que solo recibe merges con este check en verde (protección de rama).
name: ci

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  pull-requests: read # gitleaks lee los commits del PR

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: 1
    # BD desechable para las pruebas de contrato (se borra y recrea en cada corrida)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: earthcation_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # pnpm en la versión de "packageManager" (package.json raíz)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build (turbo, en orden de dependencias)
        run: pnpm build

      - name: Carga de la app sin BD
        run: node -e "require('./applications/app-service/dist/legacy/app')"
        env:
          JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
          RESEND_API_KEY: ci-sin-envio-de-correos

      - name: Límites entre capas (dependency-cruiser)
        run: pnpm boundaries

      - name: Lint
        run: pnpm lint

      - name: Pruebas (dominio, casos de uso, rest-api y contrato v1 sobre dist/)
        run: pnpm test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASS: postgres
          DB_NAME: earthcation_test

      # Informativo hasta la fase de seguridad (hoy hay vulnerabilidades conocidas en xlsx, multer, proxy-addr)
      - name: Auditoría de dependencias
        run: pnpm audit --prod --audit-level high
        continue-on-error: true

  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
