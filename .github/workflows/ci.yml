# CI de la API: corre en cada PR y en cada push a develop/master. Railway despliega master,
# que solo recibe merges con este check en verde (protección de rama).
name: ci

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

permissions:
  contents: read
  pull-requests: read # gitleaks lee los commits del PR

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # BD desechable para las pruebas de contrato (se borra y recrea en cada corrida)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: earthcation_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sintaxis de todos los archivos
        run: find index.js src scripts -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Carga de rutas y modelos (sin BD)
        run: node -e "['auth','user','session','telemetry','progress','analytics','vark','level','location','organization','bulkImport','deploy','visit','health'].forEach(r => require('./src/routes/' + r + '.routes'))"
        env:
          JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
          RESEND_API_KEY: ci-sin-envio-de-correos

      - name: Lint
        run: npm run lint

      - name: Pruebas de contrato v1
        run: npm test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASS: postgres
          DB_NAME: earthcation_test

      # Informativo hasta la fase de seguridad (hoy hay vulnerabilidades conocidas en xlsx, multer, proxy-addr)
      - name: Auditoría de dependencias
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
